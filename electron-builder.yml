appId: com.daedalus.studio
productName: Daedalus Studio

publish:
  provider: github
  owner: LuYingYiLong
  repo: daedalus-studio

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json

extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: build/backend-bootstrap
    to: backend-bootstrap
    filter:
      - daedalus-backend.exe
      - daedalus-windows-sandbox-helper.exe
      - backend-manifest.json
  - from: build/daedalus-bridge
    to: daedalus-bridge
    filter:
      - daedalus-bridge-v*.zip
      - plugin-manifest.json

asar: true
asarUnpack:
  - node_modules/node-pty/**/*

win:
  # Windows-only assets are not included in Android or other desktop targets
  extraResources:
    - from: build/computer-observation
      to: computer-observation
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

mac:
  icon: build/icon.svg

nsis:
  artifactName: "Daedalus-Studio-Setup-${version}.${ext}"
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
