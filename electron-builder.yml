appId: com.daedalus.studio
productName: Daedalus Studio

publish:
  provider: github
  owner: LuYingYiLong
  repo: daedalus-studio

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json

extraResources:
  - from: build/icon.ico
    to: icon.ico

asar: true
asarUnpack:
  - node_modules/node-pty/**/*

win:
  extraResources:
    - from: build/backend-bootstrap
      to: backend-bootstrap
      filter:
        - daedalus-backend.exe
        - daedalus-windows-sandbox-helper.exe
        - backend-manifest.json
    - from: build/daedalus-bridge
      to: daedalus-bridge
      filter:
        - daedalus-bridge-v*.zip
        - plugin-manifest.json
    - from: build/computer-observation
      to: computer-observation
    - from: build/browser-host
      to: browser-host
    - from: build/browser-extension/stable
      to: browser-extension/stable
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

linux:
  icon: build/icon.svg
  category: Development
  maintainer: l_y_y_l@icloud.com
  syncDesktopName: true
  artifactName: "Daedalus-Studio-${version}-${arch}.${ext}"
  target:
    - target: deb
      arch:
        - x64

mac:
  icon: build/icon.svg

nsis:
  artifactName: "Daedalus-Studio-Setup-${version}.${ext}"
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
