<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Daedalus Browser</title>
	</head>
	<body>
		<main>
			<h1>Daedalus Browser</h1>
			<p id="state" role="status"></p>

		</main>
		<script type="module" src="./status.ts"></script>
