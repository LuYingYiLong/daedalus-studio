name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string
      draft:
        description: "Create the release as a draft"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark the release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve fixed backend bootstrap version
        shell: pwsh
        run: |
          $package = Get-Content -LiteralPath "package.json" -Raw | ConvertFrom-Json
          if ($package.backendBootstrapVersion -notmatch "^\d+\.\d+\.\d+([-.+][0-9A-Za-z.-]+)?$") {
            throw "package.json must contain a fixed backendBootstrapVersion."
          }
          "BACKEND_BOOTSTRAP_VERSION=$($package.backendBootstrapVersion)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download and verify backend bootstrap
        run: npm run prepare:backend-bootstrap

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        run: npm run build:win

      - name: List release files
        shell: pwsh
        run: Get-ChildItem -Path release -File | Format-Table Name, Length

      - name: Verify packaged backend bootstrap
        shell: pwsh
        run: |
          $backendDir = Join-Path "release" "win-unpacked\resources\backend-bootstrap"
          $manifestPath = Join-Path $backendDir "backend-manifest.json"
          $executablePath = Join-Path $backendDir "daedalus-backend.exe"
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "Packaged backend manifest is missing."
          }
          if (-not (Test-Path -LiteralPath $executablePath -PathType Leaf)) {
            throw "Packaged backend executable is missing."
          }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.version -ne $env:BACKEND_BOOTSTRAP_VERSION) {
            throw "Packaged backend version $($manifest.version) does not match $env:BACKEND_BOOTSTRAP_VERSION."
          }
          if ((Get-FileHash -LiteralPath $executablePath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $manifest.executable.sha256) {
            throw "Packaged backend executable SHA-256 verification failed."
          }
          $files = @(Get-ChildItem -LiteralPath $backendDir -File)
          if ($files.Count -ne 2) {
            throw "Packaged backend bootstrap must contain exactly the EXE and manifest."
          }
          $selfTestJson = & $executablePath self-test --json
          if ($LASTEXITCODE -ne 0) {
            throw "Packaged backend self-test failed."
          }
          $selfTest = $selfTestJson | ConvertFrom-Json
          $passedChecks = @($selfTest.checks | Where-Object { $_.ok -eq $true } | ForEach-Object { $_.name })
          if (
            $selfTest.ok -ne $true `
            -or $selfTest.build.version -ne $manifest.version `
            -or $selfTest.build.buildId -ne $manifest.buildId `
            -or $selfTest.build.runtimeNodeVersion -ne $manifest.nodeVersion `
            -or $selfTest.build.protocolVersion -ne $manifest.protocolVersion `
            -or "runtime-assets" -notin $passedChecks `
            -or "sqlite" -notin $passedChecks `
            -or "secret-store" -notin $passedChecks
          ) {
            throw "Packaged backend self-test identity or required checks did not match the manifest."
          }

      - name: Verify updater metadata
        shell: pwsh
        run: |
          $latestPath = Join-Path "release" "latest.yml"
          $latestContent = Get-Content -LiteralPath $latestPath -Raw
          $pathMatch = [regex]::Match($latestContent, "(?m)^path:\s*(.+?)\s*$")
          if (-not $pathMatch.Success) {
            throw "latest.yml does not contain a path entry."
          }
          $installerName = $pathMatch.Groups[1].Value.Trim()
          $installerName = $installerName -replace '^[''\"]|[''\"]$', ''
          if ($installerName -match "\s") {
            throw "Installer asset names must not contain whitespace because GitHub rewrites those names: $installerName"
          }
          if ($installerName -notmatch "^Daedalus-Studio-Setup-\d+\.\d+\.\d+\.exe$") {
            throw "Unexpected installer asset name in latest.yml: $installerName"
          }
          $installerPath = Join-Path "release" $installerName
          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
            throw "latest.yml points to a missing installer: $installerName"
          }
          $blockmapPath = "$installerPath.blockmap"
          if (-not (Test-Path -LiteralPath $blockmapPath -PathType Leaf)) {
            throw "Missing installer blockmap: $installerName.blockmap"
          }
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: daedalus-studio-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: Daedalus Studio ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          overwrite_files: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
