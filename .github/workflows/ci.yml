name: Studio CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: studio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Windows Electron app
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Verify Electron runtime
        run: npm run verify:electron

      - name: Typecheck
        run: npm run typecheck

      - name: Build and test Windows computer-use helper
        run: |
          npm run build:computer
          npm run test:computer

      - name: Unit and static tests
        run: npm test

      - name: Build external browser extension and native relay
        run: |
          npm run build:browser:host
          npm run build:browser:extension
          npm run test:browser:host
          npm run test:browser

      - name: Build renderer and main process
        run: npm run build

      - name: Electron E2E smoke suite
        run: npm run test:e2e:built

      - name: Upload external browser extension and native relay
        uses: actions/upload-artifact@v4
        with:
          name: daedalus-browser-windows-${{ github.run_id }}
          path: |
            build/browser-extension/*.zip
            build/browser-host/*.exe
            build/browser-host/manifest.json
          if-no-files-found: error

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-e2e-diagnostics-${{ github.run_id }}
          path: |
            test-results/e2e
            playwright-report
          if-no-files-found: ignore

  android-debug:
    name: Build Android Remote debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build and verify debug APK
        run: |
          chmod +x android/remote-control/gradlew
          npm run build:android:debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: daedalus-remote-debug-${{ github.run_id }}
          path: android/remote-control/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
