name: Studio CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: studio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Windows Electron app
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Verify Electron runtime
        run: npm run verify:electron

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and static tests
        run: npm test

      - name: Build renderer and main process
        run: npm run build

      - name: Electron E2E smoke suite
        run: npm run test:e2e:built

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-e2e-diagnostics-${{ github.run_id }}
          path: |
            test-results/e2e
            playwright-report
          if-no-files-found: ignore
